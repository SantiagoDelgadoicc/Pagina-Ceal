{% extends 'navbar.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'calendar/css/style.css' %}">
{% endblock %}

{% block content %}
<div class="page-wrapper">
    <div class="calendar-wrapper">
        <div class="calendar-main">
            <div class="calendar-nav">
                <div class="view-tabs">
                    <button class="active">Mes</button>
                    <button>Semana</button>
                    <button>Dia</button>
                    <button>Lista</button>
                </div>

                <div class="month-title">
                    <span id="monthYearLabel"></span>
                </div>

                <div class="nav-controls">
                    <button class="btn-hoy" onclick="jumpToToday()">Hoy</button>
                    <button class="btn-arrow" onclick="changeMonth(-1)">&#10094;</button>
                    <button class="btn-arrow" onclick="changeMonth(1)">&#10095;</button>
                    <button class="btn-primary" onclick="openCreateModal()">+ Añadir</button>
                </div>
            </div>

            <div id="calendarGrid" class="calendar-grid">
                </div>
        </div>

        <div class="calendar-side">
            <div class="pin-notice">
                <span>Faltan 3 días para el paseo a terreno</span>
                <div class="pin-icon">&#128204;</div> </div>

            <div class="day-details">
                <h3 id="sidePanelTitle" class="side-panel-title">Eventos del día</h3>
                <div id="eventListContainer">
                    <p style="text-align:center; color:#999; margin-top:30px;">Selecciona un día.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="eventModal" class="modal-overlay">
    <div class="modal-content">
        <h2 id="modalTitle" style="margin-top:0;">Crea Evento</h2>
        <form method="POST" action="{% url 'create_event' %}">
            {% csrf_token %}
            <label>Nombre</label>
            <input type="text" name="title" required>
            
            <label>Categoria</label>
            <select name="category">
                <option value="EVALUATION">Evaluacion (Rojo)</option>
                <option value="SOCIAL">Evento Social (Verde)</option>
                <option value="WORKSHOP">Taller/Charla (Azul)</option>
            </select>

            <div style="display:flex; gap:10px;">
                <input type="date" name="date" required style="flex:1;">
                <input type="time" name="time" style="flex:1;">
            </div>

            <label>Descripcion</label>
            <textarea name="description" rows="3"></textarea>

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button type="button" onclick="closeModal('eventModal')" style="flex:1; padding:10px; border-radius:10px; border:1px solid #ccc; background:white; cursor:pointer;">Cancelar</button>
                <button type="submit" style="flex:2; background:#007bff; color:white; border:none; padding:10px; border-radius:10px; font-weight:bold; cursor:pointer;">Mandar a revision</button>
            </div>
        </form>
    </div>
</div>

<script>
    const events = JSON.parse('{{ events_json|escapejs }}');
    let currentData = new Date();

    const monthNames = [
        "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
        "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    function render() {
        const grid = document.getElementById('calendarGrid');
        const month = currentData.getMonth();
        const year = currentData.getFullYear();
        const monthYearLabel = document.getElementById('monthYearLabel');
        
        // Actualizar el título central estilo "Febrero 2025"
        if (monthYearLabel) monthYearLabel.innerText = `${monthNames[month]} ${year}`;

        // Días de la semana
        grid.innerHTML = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'].map(d => 
            `<div class="cal-header-day">${d}</div>`
        ).join('');

        let firstDay = new Date(year, month, 1).getDay();
        let daysInMonth = new Date(year, month + 1, 0).getDate();

        // Celdas vacías iniciales
        for(let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="cal-day empty"></div>`;
        }

        // Celdas con días
        for(let d = 1; d <= daysInMonth; d++) {
            let dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            let dayEvents = events.filter(e => e.date === dateStr);
            
            let today = new Date();
            let isToday = (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) ? 'today' : '';
            
            let tags = dayEvents.map(e => `
                <div class="event-tag cat-${e.category} ${e.is_modified ? 'highlight-modified' : ''}" title="${e.title}">
                    ${e.title}
                </div>
            `).join('');
            
            grid.innerHTML += `
                <div class="cal-day ${isToday}" onclick="showDay('${dateStr}', ${d})">
                    <span class="date-number">${d}</span>
                    <div style="flex-grow: 1; overflow-y: auto; max-height: 60px;">
                        ${tags}
                    </div>
                </div>`;
        }
    }

    function showDay(dateStr, dayNum) {
        const list = document.getElementById('eventListContainer');
        const title = document.getElementById('sidePanelTitle');
        const dayEvents = events.filter(e => e.date === dateStr);
        
        if (title) title.innerText = `Eventos del día`;
        
        if (list) {
            list.innerHTML = dayEvents.length ? dayEvents.map(e => `
                <div class="event-item">
                    <div class="event-item-time">
                        ${e.time ? e.time.substring(0,5) : 'Todo el día'}
                    </div>
                    <div class="event-item-content">
                        <span class="event-item-title">${e.title}</span>
                        <p style="font-size:0.85rem; margin:4px 0; color: #666;">${e.description}</p>
                        <button onclick="openEditModal(${e.id})" 
                                style="background: none; border: 1px solid #007bff; color: #007bff; border-radius: 5px; cursor: pointer; font-size: 0.7rem; padding: 2px 8px; margin-top:5px;">
                            Editar
                        </button>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center; color:#999; margin-top:30px;">No hay eventos programados.</p>';
        }
    }

    function openEditModal(eventId) {
        const event = events.find(e => e.id === eventId);
        if (!event) return;

        document.getElementById('modalTitle').innerText = "Editar Evento";
        const form = document.querySelector('#eventModal form');
        form.action = `/Calendario-Academico/update/${eventId}/`; 
        form.querySelector('[name="title"]').value = event.title;
        openModal('eventModal');
    }

    function openCreateModal() {
        document.getElementById('modalTitle').innerText = "Crea Evento";
        const form = document.querySelector('#eventModal form');
        form.action = "{% url 'create_event' %}";
        form.reset();
        openModal('eventModal');
    }

    function changeMonth(step) {
        currentData.setMonth(currentData.getMonth() + step);
        render();
    }

    function jumpToToday() {
        currentData = new Date();
        render();
    }

    function openModal(id) { 
        document.getElementById(id).style.display = 'flex'; 
    }
    
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
    }
    
    window.onload = () => {
        render();
    };
</script>
{% endblock %}
