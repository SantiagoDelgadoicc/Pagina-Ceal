{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>CEAL - Calendario Academico</title>
    <link rel="stylesheet" href="{% static 'calendar/css/style.css' %}">
</head>
<body>
    <h1>Pagina Calendario Academico</h1>
    <p>DIICC</p>
    {% extends 'navbar.html' %}

    {% block content %}
    <div class="calendar-wrapper" style="display: flex; gap: 20px; padding: 20px; font-family: sans-serif;">
        <div class="calendar-main" style="flex: 3; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <div class="calendar-nav" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <div>
                    <button onclick="changeMonth(-1)">&#10094;</button>
                    <select id="monthPicker" onchange="jumpToMonth()"></select>
                    <span id="yearLabel"></span>
                    <button onclick="changeMonth(1)">&#10095;</button>
                </div>
                <button class="btn-primary" onclick="openCreateModal()" style="background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2); transition: all 0.3s ease;">+ Añadir evento</button>
            </div>

            <div id="calendarGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #eee; border: 1px solid #eee;">
                </div>
        </div>

        <div class="calendar-side" style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
            <div class="pin-notice" style="background: white; padding: 15px; border-radius: 30px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                Faltan 3 días para el paseo a terreno
            </div>
            <div class="day-details" style="background: white; padding: 20px; border-radius: 15px; min-height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <h3 id="sidePanelTitle" style="background: #007bff; color: white; text-align: center; border-radius: 20px; padding: 5px;">Eventos del día</h3>
                <div id="eventListContainer"></div>
            </div>
        </div>
    </div>

    <div id="eventModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; justify-content:center; align-items:center;">
        <div class="modal-content" style="background:white; padding:30px; border-radius:20px; width:400px;">
            <h2 id="modalTitle" >Crea Evento</h2>
            <form method="POST" action="{% url 'create_event' %}">
                {% csrf_token %}
                <label>Nombre</label>
                <input type="text" name="title" required style="width:100%; margin-bottom:15px; padding:10px;">
                
                <label>Categoria</label>
                <select name="category" style="width:100%; margin-bottom:15px; padding:10px;">
                    <option value="EVALUATION">Evaluacion (Rojo)</option>
                    <option value="SOCIAL">Evento Social(Verde)</option>
                    <option value="WORKSHOP">Taller/Charla (Azul)</option>
                </select>

                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="date" name="date" required style="flex:1; padding:10px;">
                    <input type="time" name="time" style="flex:1; padding:10px;">
                </div>

                <label>Descripcion</label>
                <textarea name="description" style="width:100%; padding:10px;" rows="3"></textarea>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="button" onclick="closeModal('eventModal')" style="flex:1;">Cancelar</button>
                    <button type="submit" style="flex:2; background:#007bff; color:white; border:none; padding:10px; border-radius:10px;">Mandar a revision</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .cal-day { background: white; min-height: 90px; padding: 5px; overflow-y: auto; cursor: pointer; }
        .cal-day:hover { background: #f0f7ff; }
        .today { background: #e7f1ff !important; font-weight: bold; }
        .event-tag { font-size: 0.7rem; color: white; padding: 2px 4px; border-radius: 4px; margin-bottom: 2px; }
        .cat-EVALUATION { background: #dc3545; }
        .cat-SOCIAL { background: #28a745; }
        .cat-WORKSHOP { background: #007bff; }
        .highlight-modified { border: 2px solid #ffc107; background: #fed241 !important; }
    </style>

    <script>
        const events = JSON.parse('{{ events_json|escapejs }}');
        let currentData = new Date();

        const monthNames = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        function initMonthPicker() {
            const picker = document.getElementById('monthPicker');
            if (picker) {
                picker.innerHTML = monthNames.map((name, index) => 
                    `<option value="${index}">${name}</option>`
                ).join('');
            }
        }

        function render() {
            const grid = document.getElementById('calendarGrid');
            const month = currentData.getMonth();
            const year = currentData.getFullYear();
            const yearLabel = document.getElementById('yearLabel');
            const monthPicker = document.getElementById('monthPicker');
            
            if (yearLabel) yearLabel.innerText = year;
            if (monthPicker) monthPicker.value = month;

            grid.innerHTML = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'].map(d => 
                `<div style="text-align:center; font-weight:bold; padding:10px; background:white; border-bottom:1px solid #eee;">${d}</div>`
            ).join('');

            let firstDay = new Date(year, month, 1).getDay();
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            for(let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="cal-day" style="background:#fafafa; border:0.5px solid #eee;"></div>`;
            }

            for(let d = 1; d <= daysInMonth; d++) {
                let dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                let dayEvents = events.filter(e => e.date === dateStr);
                
                let today = new Date();
                let isToday = (d === today.getDate() && month === today.getMonth() && year === today.getFullYear()) ? 'today' : '';
                
                let tags = dayEvents.map(e => `
                    <div class="event-tag cat-${e.category} ${e.is_modified ? 'highlight-modified' : ''}" 
                        style="font-size: 0.7rem; color: white; padding: 2px 4px; border-radius: 4px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                        title="${e.title}">
                        ${e.title}
                    </div>
                `).join('');
                
                grid.innerHTML += `
                    <div class="cal-day ${isToday}" onclick="showDay('${dateStr}', ${d})" 
                        style="background: white; min-height: 90px; padding: 5px; border: 0.5px solid #eee; cursor: pointer; display: flex; flex-direction: column;">
                        <div style="text-align:right; font-size:0.8rem; color:#777; margin-bottom:4px;">${d}</div>
                        <div style="flex-grow: 1; overflow-y: auto; max-height: 60px;">
                            ${tags}
                        </div>
                    </div>`;
            }
        }

        function showDay(dateStr, dayNum) {
            const list = document.getElementById('eventListContainer');
            const title = document.getElementById('sidePanelTitle');
            const dayEvents = events.filter(e => e.date === dateStr);
            
            if (title) title.innerText = `Day ${dayNum}`;
            
            if (list) {
                list.innerHTML = dayEvents.length ? dayEvents.map(e => `
                    <div style="padding:15px; border-bottom:1px solid #eee; position: relative;">
                        <strong style="display:block; color: #333;">${e.title}</strong>
                        <small style="color: #007bff; font-weight: bold;">${e.time ? e.time.substring(0,5) : 'All day'}</small>
                        <p style="font-size:0.85rem; margin:8px 0; color: #666;">${e.description}</p>
                        <button onclick="openEditModal(${e.id})" 
                                style="background: none; border: 1px solid #007bff; color: #007bff; border-radius: 5px; cursor: pointer; font-size: 0.7rem; padding: 2px 8px;">
                            Edit
                        </button>
                    </div>
                `).join('') : '<p style="text-align:center; color:#999; margin-top:30px;">No events scheduled.</p>';
            }
}
        function openEditModal(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;

            document.getElementById('modalTitle').innerText = "Edit Event";
            const form = document.querySelector('#eventModal form');

            form.action = `/Calendario-Academico/update/${eventId}/`; 

            form.querySelector('[name="title"]').value = event.title;
            
            openModal('eventModal');
        }

        function openCreateModal() {
            document.getElementById('modalTitle').innerText = "Crea Evento";
            const form = document.querySelector('#eventModal form');
            form.action = "{% url 'create_event' %}";
            form.reset();
            openModal('eventModal');
}
        function changeMonth(step) {
            currentData.setMonth(currentData.getMonth() + step);
            render();
        }

        function jumpToMonth() {
            const picker = document.getElementById('monthPicker');
            currentData.setMonth(parseInt(picker.value));
            render();
        }
        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
        }
        
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
        }
        
        window.onload = () => {
            initMonthPicker();
            render();
        };
    </script>
    {% endblock %}
</body>
</html>
